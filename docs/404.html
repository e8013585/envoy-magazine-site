<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found – Envoy</title>
<style>
  :root { --bg:#fbfbfa; --text:#2f3437; --muted:#787774; --btn:#111; --btn-fg:#fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#141413; --text:#d9d8d4; --muted:#9b9a97; --btn:#f3f2ee; --btn-fg:#111; } }
  :root[data-theme="dark"] { --bg:#141413; --text:#d9d8d4; --muted:#9b9a97; --btn:#f3f2ee; --btn-fg:#111; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:16px/1.6 'Helvetica Neue', Helvetica, Arial, sans-serif; padding:16px; text-align:center; }
  h1 { font-family: Georgia, serif; font-weight:400; font-size:40px; letter-spacing:-0.03em; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 24px; }
  a { display:inline-block; background:var(--btn); color:var(--btn-fg); padding:10px 18px; border-radius:6px; text-decoration:none; }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>The page you were looking for has moved or no longer exists.</p>
  <a id="home" href="/">Back to Envoy</a>
</main>
<script>
  // On a GitHub project site the app lives under /<repo>/, not at the domain root.
  var seg = location.pathname.split('/').filter(Boolean)[0];
  if (/\.github\.io$/.test(location.hostname) && seg) document.getElementById('home').href = '/' + seg + '/';
</script>
</body>
</html>
